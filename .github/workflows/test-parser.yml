name: Test Sysmon parser

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/test-parser.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v
